<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Great Clips Performance Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0d0f14;--surface:#161920;--surface2:#1e2229;--border:#2a2f3a;
    --text:#e8eaf0;--muted:#7a8099;--gc-blue:#0066cc;
    --green:#22c55e;--yellow:#f59e0b;--red:#ef4444;--orange:#f97316;--accent:#38bdf8;
    --font-mono:'DM Mono',monospace;--font-sans:'DM Sans',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--text);font-family:var(--font-sans);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
  #loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:999}
  .spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--gc-blue);border-radius:50%;animation:spin 0.8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loading p{font-size:13px;color:var(--muted)}
  header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100}
  .logo{display:flex;align-items:center;gap:10px}
  .logo-icon{width:32px;height:32px;background:var(--gc-blue);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:white;font-family:var(--font-mono);flex-shrink:0}
  .logo-text{font-size:14px;font-weight:600}
  .logo-sub{font-size:11px;color:#b0b6c4;letter-spacing:.06em;text-transform:uppercase}
  .week-badge{background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:5px 11px;font-size:12px;font-family:var(--font-mono);color:var(--accent);white-space:nowrap}
  .salon-tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .salon-tabs::-webkit-scrollbar{display:none}
  .tab-btn{background:none;border:none;color:#b0b6c4;font-family:var(--font-sans);font-size:15px;font-weight:600;padding:11px 16px 12px;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;flex-shrink:0}
  .tab-btn:hover{color:var(--text)}
  .tab-btn.active{color:var(--text);border-bottom-color:var(--gc-blue)}
  .tab-num{font-family:var(--font-mono);font-size:10px;color:var(--gc-blue);display:block;margin-bottom:1px;font-weight:600}
  .main{padding:16px;max-width:900px;margin:0 auto}
  .salon-panel{display:none}
  .salon-panel.active{display:block}
  .section-label{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text);margin-bottom:10px;padding-left:2px}
  .kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
  @media(min-width:600px){.kpi-row{grid-template-columns:repeat(4,1fr)}}
  .kpi-card{background:linear-gradient(180deg,color-mix(in srgb,var(--accent-color,var(--gc-blue)) 14%,var(--surface)) 0%,var(--surface) 55%);border:1px solid color-mix(in srgb,var(--accent-color,var(--gc-blue)) 35%,var(--border));border-left:4px solid var(--accent-color,var(--gc-blue));border-radius:10px;padding:14px 14px 12px;position:relative;overflow:hidden;box-shadow:0 1px 8px color-mix(in srgb,var(--accent-color,var(--gc-blue)) 18%,transparent)}
  .kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:var(--accent-color,var(--gc-blue))}
  .kpi-label{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text);margin-bottom:6px;line-height:1.3}
  .kpi-value{font-family:var(--font-mono);font-size:28px;font-weight:500;color:var(--text);line-height:1}
  .kpi-value span{font-size:20px;color:#b0b6c4;font-weight:500}
  .kpi-sub{font-size:14px;color:#b0b6c4;margin-top:7px;line-height:1.3}
  .badge{display:inline-block;font-family:var(--font-mono);font-size:11px;padding:2px 6px;border-radius:4px;font-weight:500}
  .badge.green{background:rgba(34,197,94,.15);color:#4ade80}
  .badge.red{background:rgba(239,68,68,.15);color:#f87171}
  .badge.yellow{background:rgba(245,158,11,.15);color:#fbbf24}
  .badge.orange{background:rgba(249,115,22,.15);color:#fb923c}
  .badge.blue{background:rgba(56,189,248,.15);color:var(--accent)}
  .alert-banner{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:11px 14px;margin-bottom:16px;display:flex;gap:8px;font-size:12px;color:#fca5a5;line-height:1.5}
  .info-banner{background:rgba(56,189,248,.06);border:1px solid rgba(56,189,248,.2);border-radius:8px;padding:11px 14px;margin-bottom:16px;display:flex;gap:8px;font-size:12px;color:var(--accent);line-height:1.5}
  .alert-icon{flex-shrink:0;font-size:14px;margin-top:1px}
  .charts-row{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:20px}
  @media(min-width:700px){.charts-row{grid-template-columns:1.6fr 1fr}}
  .chart-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px}
  .chart-title{font-size:14px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text);margin-bottom:12px}
  .chart-wrap{position:relative;height:180px}
  .ytd-strip{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 12px;margin-bottom:10px;background:var(--surface2);border:1px solid var(--border);border-radius:6px}
  .ytd-label{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text)}
  .ytd-vals{font-family:var(--font-mono);font-size:18px;font-weight:700;color:#f3f5fa}
  .ytd-vals .sep{color:var(--muted);margin:0 7px;font-weight:500;font-size:14px}
  .ytd-vals .prior{color:#b0b6c4;font-weight:600}
  .ytd-growth{font-family:var(--font-mono);font-size:15px;padding:4px 9px;border-radius:5px;font-weight:700}
  .ytd-growth.green{background:rgba(34,197,94,.15);color:#4ade80}
  .ytd-growth.red{background:rgba(239,68,68,.15);color:#f87171}
  .ytd-growth.muted{background:var(--surface);color:var(--muted)}
  .stylist-section{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:20px}
  .stylist-header{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px}
  .stylist-title{font-size:15px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text)}
  .stylist-note{font-size:13px;color:#b0b6c4;font-style:italic}
  .stylist-cards{padding:9px;display:flex;flex-direction:column;gap:8px}
  .stylist-card{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:11px 13px}
  .sc-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:8px}
  .sc-name{font-size:17px;font-weight:600;color:var(--text);line-height:1.2;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sc-custs{font-family:var(--font-mono);font-size:15px;color:#b0b6c4;font-weight:500;white-space:nowrap}
  .sc-custs b{color:var(--text);font-weight:600}
  .sc-chips{display:flex;flex-wrap:wrap;gap:6px}
  .sc-chip{display:inline-flex;align-items:center;padding:6px 10px;border-radius:7px;font-family:var(--font-mono);font-size:16px;font-weight:500;line-height:1}
  .sc-chip .sc-cl{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-right:7px;opacity:.9}
  .sc-chip.green{background:rgba(34,197,94,.18);color:#86efac}
  .sc-chip.yellow{background:rgba(245,158,11,.18);color:#fcd34d}
  .sc-chip.orange{background:rgba(249,115,22,.18);color:#fdba74}
  .sc-chip.red{background:rgba(239,68,68,.18);color:#fca5a5}
  .sc-chip.gray{background:rgba(122,128,153,.15);color:#b0b6c4}
  .stylist-table-wrap{display:none}
  @media(min-width:700px){
    .stylist-cards{display:none}
    .stylist-table-wrap{display:block}
    table{width:100%;border-collapse:collapse}
    th{padding:9px 14px;font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;border-bottom:1px solid var(--border);background:var(--surface2);white-space:nowrap}
    th.right{text-align:right}
    td{padding:10px 14px;font-size:13px;border-bottom:1px solid rgba(42,47,58,.6);vertical-align:middle}
    tr:last-child td{border-bottom:none}
    tr:hover td{background:rgba(255,255,255,.02)}
    td.right{text-align:right}
    td.bold{font-weight:500}
  }
  .pill{display:inline-flex;align-items:center;justify-content:center;padding:2px 7px;border-radius:4px;font-family:var(--font-mono);font-size:11px;font-weight:500;min-width:48px}
  .pill.green{background:rgba(34,197,94,.12);color:#4ade80}
  .pill.yellow{background:rgba(245,158,11,.12);color:#fbbf24}
  .pill.orange{background:rgba(249,115,22,.12);color:#fb923c}
  .pill.red{background:rgba(239,68,68,.12);color:#f87171}
  .pill.gray{background:rgba(122,128,153,.12);color:var(--muted)}
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div><p>Loading dashboard data...</p></div>

<header>
  <div class="logo">
    <div class="logo-icon">GC</div>
    <div><div class="logo-text">Performance Dashboard</div><div class="logo-sub" id="logo-sub">Owner View</div></div>
  </div>
  <div class="week-badge" id="week-label">Loading...</div>
</header>

<div class="salon-tabs" id="salon-tabs"></div>
<div class="main" id="main-content"></div>

<script>
// ── Custom tier thresholds ────────────────────────────────────────────────────
// New Cust Return: Excellence 38%+, Growth 32-37.9%, Minimum 26-31.9%, Warning <26%
// Repeat Return:   Excellence 77%+, Growth 74-76.9%, Minimum 71-73.9%, Warning <71%
// CPH:             Excellence 2.3+, Growth 2.0-2.29, Minimum 1.8-1.99, Warning <1.8
// HC Time:         on target 14-17 (green), off target <14 or >17 (orange)
// Avg Wait:        Excellence <=5, Growth 5-9, Minimum 10-14, Warning 15+

function tierLabel(cls) {
  if(cls==='green') return 'Excellence';
  if(cls==='yellow') return 'Growth';
  if(cls==='orange') return 'Minimum';
  return 'Warning';
}

function pill(v,thresholds,fmt,invert){
  if(v===null||v===undefined) return '<span class="pill gray">—</span>';
  let cls;
  if(invert){
    cls=v<=thresholds[0]?'green':v<=thresholds[1]?'yellow':v<=thresholds[2]?'orange':'red';
  } else {
    cls=v>=thresholds[2]?'green':v>=thresholds[1]?'yellow':v>=thresholds[0]?'orange':'red';
  }
  return `<span class="pill ${cls}">${fmt(v)}</span>`;
}
const pct1=v=>v.toFixed(1)+'%';
const fix1=v=>v.toFixed(1);
const fixm=v=>v.toFixed(1)+'m';
const newRetPill=v=>pill(v,[26,28,30],pct1,false);
const regPctPill=v=>pill(v,[71,74,77],pct1,false);
const cphPill=v=>pill(v,[1.8,2.0,2.3],fix1,false);

// HC Time is a band, not a ladder: cutting too fast is as much a problem as
// cutting too slow, so anything outside 14-17 is flagged the same way.
const hcClass=v=>(v>=14&&v<=17)?'green':'orange';
const hcPill=v=>v===null||v===undefined
  ? '<span class="pill gray">—</span>'
  : `<span class="pill ${hcClass(v)}">${fixm(v)}</span>`;

function diffBadge(val,bench,higherBetter,suffix){
  if(val===null||val===undefined||bench===null) return '';
  suffix=suffix||'';
  const diff=val-bench, sign=diff>=0?'+':'';
  const cls=(diff>=0)===higherBetter?'green':'red';
  return `<span class="badge ${cls}">${sign}${diff.toFixed(1)}${suffix}</span>`;
}

const fmtNum=n=>n==null?'—':Number(n).toLocaleString();

function chip(label, v, thresholds, fmt, invert){
  if(v===null||v===undefined) return `<span class="sc-chip gray"><span class="sc-cl">${label}</span>—</span>`;
  let cls;
  if(invert){
    cls=v<=thresholds[0]?'green':v<=thresholds[1]?'yellow':v<=thresholds[2]?'orange':'red';
  } else {
    cls=v>=thresholds[2]?'green':v>=thresholds[1]?'yellow':v>=thresholds[0]?'orange':'red';
  }
  return `<span class="sc-chip ${cls}"><span class="sc-cl">${label}</span>${fmt(v)}</span>`;
}
function hcChip(label, v){
  if(v===null||v===undefined) return `<span class="sc-chip gray"><span class="sc-cl">${label}</span>—</span>`;
  return `<span class="sc-chip ${hcClass(v)}"><span class="sc-cl">${label}</span>${fixm(v)}</span>`;
}
function ytdStrip(y){
  if(!y) return '';
  const g=y.growth_pct;
  const gCls = g==null ? 'muted' : (g>=0 ? 'green' : 'red');
  const gTxt = g==null ? '—' : (g>=0?'+':'')+g.toFixed(1)+'%';
  return `<div class="ytd-strip">
    <span class="ytd-label">YTD Customers <span style="color:var(--muted);font-weight:400">(${y.weeks}w)</span></span>
    <span class="ytd-vals">${fmtNum(y.curr)}<span class="sep">vs</span><span class="prior">${fmtNum(y.prior)} LY</span></span>
    <span class="ytd-growth ${gCls}">${gTxt}</span>
  </div>`;
}

// ── Build panel HTML ──────────────────────────────────────────────────────────
function buildPanel(snum,data){
  const kpi=data.kpis[snum]||{}, b=data.bench;
  const stylists=data.stylists[snum]||[];
  const name=data.salon_names[snum];
  const isNew=snum==='4216';

  const yoyBadge=kpi.yoy!==null&&kpi.yoy!==undefined
    ?`<span class="badge ${kpi.yoy>=0?'green':'red'}">${kpi.yoy>=0?'+':''}${kpi.yoy}% YoY</span>`
    :'<span class="badge blue">New Salon</span>';

  let alert='';
  if(snum==='3750'&&kpi.cph&&kpi.cph<1.9)
    alert=`<div class="alert-banner"><span class="alert-icon">⚠</span><span><strong>CPH Alert:</strong> County Line CPH of ${kpi.cph} is well below the system average of ${b.avg_cph}. Strong retention — but slow throughput is capping growth.</span></div>`;
  if(snum==='3826'&&kpi.avg_wait&&kpi.avg_wait>10)
    alert=`<div class="alert-banner"><span class="alert-icon">🚨</span><span><strong>Wait Time Alert:</strong> ${kpi.avg_wait}-min avg wait is ${(kpi.avg_wait/b.avg_wait).toFixed(1)}× the system average. High HC times are driving customers away before they build loyalty.</span></div>`;
  if(isNew)
    alert=`<div class="info-banner"><span class="alert-icon">ℹ</span><span><strong>New Salon:</strong> Customer return data not yet available — requires ~15 weeks of history. New customer % of ${kpi.new_cust_pct}% is expected for a new location still building its base.</span></div>`;

  const waitColor=kpi.avg_wait<=5?'var(--green)':kpi.avg_wait<=9?'var(--yellow)':kpi.avg_wait<=14?'var(--orange)':'var(--red)';
  const waitBadge=kpi.avg_wait<=5?'<span class="badge green">'+kpi.avg_wait+'m</span>':kpi.avg_wait<=9?'<span class="badge yellow">'+kpi.avg_wait+'m</span>':kpi.avg_wait<=14?'<span class="badge orange">'+kpi.avg_wait+'m</span>':'<span class="badge red">'+kpi.avg_wait+'m</span>';

  const rankBadge = kpi.rank ? `<span class="badge ${kpi.rank<=25?'green':kpi.rank<=50?'yellow':'red'}">#${kpi.rank} of ${b.total_salons}</span>` : '<span class="badge blue">New Salon</span>';

  const y = data.ytd?.[snum];
  const ytdAccent = !y || y.growth_pct==null ? 'var(--gc-blue)' : (y.growth_pct>=0 ? 'var(--green)' : 'var(--red)');
  const ytdValue = !y || y.growth_pct==null ? '<span style="font-size:16px">—</span>' : (y.growth_pct>=0?'+':'')+y.growth_pct.toFixed(1)+'<span>%</span>';
  const ytdSub = !y ? '' : (y.prior>0 ? `Cust, ${y.curr.toLocaleString()} vs ${y.prior.toLocaleString()} LY (${y.weeks}w)` : `Cust, ${y.curr.toLocaleString()} YTD (${y.weeks}w · new salon)`);

  const kpiCards=`
    <div class="kpi-card" style="--accent-color:${(kpi.yoy||0)>=10?'var(--green)':'var(--gc-blue)'}">
      <div class="kpi-label">Customers</div><div class="kpi-value">${kpi.cust||'—'}</div>
      <div class="kpi-sub">${yoyBadge} ${rankBadge}</div></div>
    <div class="kpi-card" style="--accent-color:${ytdAccent}">
      <div class="kpi-label">Customer YTD vs LYTD</div><div class="kpi-value">${ytdValue}</div>
      <div class="kpi-sub">${ytdSub}</div></div>
    <div class="kpi-card" style="--accent-color:var(--green)">
      <div class="kpi-label">New Customers</div><div class="kpi-value">${kpi.new_cust||'—'}</div>
      <div class="kpi-sub">${kpi.new_cust_pct}% of total this week</div></div>
    <div class="kpi-card" style="--accent-color:${(kpi.new_return||0)>=30?'var(--green)':(kpi.new_return||0)>=28?'var(--yellow)':(kpi.new_return||0)>=26?'var(--orange)':'var(--red)'}">
      <div class="kpi-label">New Cust Return</div>
      <div class="kpi-value">${kpi.new_return!==null&&kpi.new_return!==undefined?kpi.new_return+'<span>%</span>':'<span style="font-size:16px">—</span>'}</div>
      <div class="kpi-sub">${kpi.new_return!==null&&kpi.new_return!==undefined?'<span class="badge '+(kpi.new_return>=30?'green':kpi.new_return>=28?'yellow':kpi.new_return>=26?'orange':'red')+'">'+kpi.new_return.toFixed(1)+'%</span>':'not yet available'}</div></div>
    <div class="kpi-card" style="--accent-color:${(kpi.repeat_return||0)>=77?'var(--green)':(kpi.repeat_return||0)>=74?'var(--yellow)':(kpi.repeat_return||0)>=71?'var(--orange)':'var(--red)'}">
      <div class="kpi-label">Repeat Return</div>
      <div class="kpi-value">${kpi.repeat_return!==null&&kpi.repeat_return!==undefined?kpi.repeat_return+'<span>%</span>':'<span style="font-size:16px">—</span>'}</div>
      <div class="kpi-sub">${kpi.repeat_return!==null&&kpi.repeat_return!==undefined?'<span class="badge '+(kpi.repeat_return>=74?'green':kpi.repeat_return>=74?'yellow':kpi.repeat_return>=71?'orange':'red')+'">'+kpi.repeat_return.toFixed(1)+'%</span>':'not yet available'}</div></div>
    <div class="kpi-card" style="--accent-color:${(kpi.cph||0)>=(b.avg_cph||2)?'var(--green)':'var(--red)'}">
      <div class="kpi-label">Cuts Per Hour</div><div class="kpi-value">${kpi.cph||'—'}</div>
      <div class="kpi-sub">${diffBadge(kpi.cph,b.avg_cph,true)} sys ${b.avg_cph}</div></div>
    <div class="kpi-card" style="--accent-color:${waitColor}">
      <div class="kpi-label">Avg Wait</div><div class="kpi-value">${kpi.avg_wait}<span> min</span></div>
      <div class="kpi-sub">${waitBadge} sys ${b.avg_wait}m</div></div>
    <div class="kpi-card" style="--accent-color:var(--${hcClass(kpi.hc_time)})">
      <div class="kpi-label">Avg HC Time</div><div class="kpi-value">${kpi.hc_time}<span> min</span></div>
      <div class="kpi-sub">${diffBadge(kpi.hc_time,b.avg_hc_time,false)} sys ${b.avg_hc_time}</div></div>`;

  const stylistCards=stylists.map(s=>`
    <div class="stylist-card">
      <div class="sc-row">
        <div class="sc-name">${s.name}</div>
        <div class="sc-custs"><b>${s.cust_count||0}</b> custs</div>
      </div>
      <div class="sc-chips">
        ${chip('NR', s.new_return, [26,28,30], pct1, false)}
        ${chip('Reg', s.reg_pct, [71,74,77], pct1, false)}
        ${chip('CPH', s.cph, [1.8,2.0,2.3], fix1, false)}
        ${hcChip('HC', s.hc_time)}
      </div>
    </div>`).join('');

  const stylistRows=stylists.map(s=>`
    <tr>
      <td class="bold">${s.name}</td>
      <td class="right" style="font-family:var(--font-mono);font-size:12px">${s.cust_count>0?s.cust_count:'—'}</td>
      <td class="right">${newRetPill(s.new_return)}</td>
      <td class="right">${regPctPill(s.reg_pct)}</td>
      <td class="right">${cphPill(s.cph)}</td>
      <td class="right">${hcPill(s.hc_time)}</td>
    </tr>`).join('');

  return `
  <div class="salon-panel" id="panel-${snum}">
    ${alert}
    <div class="section-label">KPIs · Week of ${data.week_label}</div>
    <div class="kpi-row">${kpiCards}</div>
    <div class="charts-row">
      <div class="chart-card">
        <div class="chart-title">Weekly Customers — This Year vs Last Year</div>
        ${ytdStrip(data.ytd?.[snum])}

// ── Charts ────────────────────────────────────────────────────────────────────
const charts={};
const benchLine=(val,color)=>({
  id:'bl'+Math.random(),
  afterDraw(c){
    const{ctx,scales:{y}}=c;if(!y)return;
    const yp=y.getPixelForValue(val);
    ctx.save();ctx.beginPath();
    ctx.moveTo(c.chartArea.left,yp);ctx.lineTo(c.chartArea.right,yp);
    ctx.strokeStyle=color||'rgba(255,165,50,0.65)';ctx.lineWidth=1.5;ctx.setLineDash([4,3]);
    ctx.stroke();ctx.restore();
  }
});
const base={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}};
const xt={color:'#7a8099',font:{family:'DM Mono',size:9}};
const ytTrend={color:'#b0b6c4',font:{family:'DM Mono',size:12,weight:'600'}};
const gc='rgba(255,255,255,0.04)';
const pointLabels=(color)=>({
  id:'pl'+Math.random(),
  afterDatasetsDraw(c){
    const ctx=c.ctx, meta=c.getDatasetMeta(0);
    if(!meta||!meta.data)return;
    ctx.save();
    ctx.font='700 13px "DM Sans"';
    ctx.fillStyle=color||'#e8eaf0';
    ctx.textAlign='center';
    ctx.textBaseline='bottom';
    ctx.shadowColor='rgba(0,0,0,0.55)';
    ctx.shadowBlur=4;
    meta.data.forEach((pt,i)=>{
      const v=c.data.datasets[0].data[i];
      if(v==null)return;
      ctx.fillText(v,pt.x,pt.y-8);
    });
    ctx.restore();
  }
});

function makeTrend(id,snum,data){
  const el=document.getElementById(id);if(!el||charts[id])return;
  const d=data.trend[snum];
  const allVals=[...d.curr,...d.prior.filter(v=>v>0)];
  charts[id]=new Chart(el,{type:'line',
    data:{labels:d.dates,datasets:[
      {label:'This Year',data:d.curr,borderColor:'rgba(56,189,248,1)',backgroundColor:'rgba(56,189,248,0.08)',borderWidth:2.5,pointRadius:3.5,pointBackgroundColor:'rgba(56,189,248,1)',tension:0.3,fill:true},
      {label:'Last Year',data:d.prior.map(v=>v||null),borderColor:'rgba(156,163,175,0.6)',backgroundColor:'transparent',borderWidth:1.5,pointRadius:2,pointBackgroundColor:'rgba(156,163,175,0.6)',tension:0.3,fill:false,borderDash:[4,3],spanGaps:true}
    ]},
    options:{...base,
      layout:{padding:{top:18}},
      plugins:{legend:{display:true,position:'top',labels:{color:'#b0b6c4',font:{family:'DM Sans',size:12,weight:'600'},boxWidth:22,padding:14}},tooltip:{callbacks:{label:c=>' '+c.dataset.label+': '+c.parsed.y+' custs'}}},
      scales:{
        x:{grid:{color:gc,drawTicks:false},border:{display:false},ticks:{display:false}},
        y:{grid:{color:gc},ticks:ytTrend,suggestedMin:Math.min(...allVals)*0.88}
      }
    }
  });
}
function makeNewRet(id,snum,data){
  const el=document.getElementById(id);if(!el||charts[id])return;
  const rows=data.stylists[snum].filter(s=>s.new_return!==null);
  const vals=rows.map(s=>s.new_return);
  const colors=vals.map(v=>v>=30?'rgba(34,197,94,0.7)':v>=26?'rgba(245,158,11,0.7)':'rgba(239,68,68,0.7)');
  charts[id]=new Chart(el,{type:'bar',
    data:{labels:rows.map(s=>s.name.split(',')[0]),datasets:[{data:vals,backgroundColor:colors,borderRadius:3,borderSkipped:false}]},
    options:{...base,indexAxis:'y',scales:{x:{grid:{color:gc},ticks:{...xt,callback:v=>v+'%'},max:70},y:{grid:{display:false},ticks:{color:'#e8eaf0',font:{family:'DM Sans',size:10}}}},plugins:{...base.plugins,tooltip:{callbacks:{label:c=>' '+c.parsed.x.toFixed(1)+'%'}}}},
    plugins:[benchLine(data.bench.avg_new_return,'rgba(255,100,100,0.6)')]});
}
function makeCPH(id,snum,data){
  const el=document.getElementById(id);if(!el||charts[id])return;
  const rows=data.stylists[snum].filter(s=>s.cph!==null&&s.cust_count>0);
  const vals=rows.map(s=>s.cph);
  const colors=vals.map(v=>v>=2.2?'rgba(34,197,94,0.7)':v>=1.8?'rgba(245,158,11,0.7)':'rgba(239,68,68,0.7)');
  charts[id]=new Chart(el,{type:'bar',
    data:{labels:rows.map(s=>s.name.split(',')[0]),datasets:[{data:vals,backgroundColor:colors,borderRadius:3}]},
    options:{...base,indexAxis:'y',scales:{x:{grid:{color:gc},ticks:xt},y:{grid:{display:false},ticks:{color:'#e8eaf0',font:{family:'DM Sans',size:10}}}},plugins:{...base.plugins,tooltip:{callbacks:{label:c=>' '+c.parsed.x.toFixed(2)+' CPH'}}}},
    plugins:[benchLine(data.bench.avg_cph,'rgba(255,100,100,0.6)')]});
}

function initCharts(snum,data){
  if(snum==='4216'){makeTrend('trend-4216','4216',data);makeCPH('cph-4216','4216',data);}
  else{makeTrend('trend-'+snum,snum,data);makeNewRet('newret-'+snum,snum,data);}
}

let appData=null;
function showSalon(snum,btn){
  document.querySelectorAll('.salon-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('panel-'+snum).classList.add('active');
  btn.classList.add('active');
  setTimeout(()=>initCharts(snum,appData),50);
}
