name: Weekly Report

on:
  # 9 AM EDT Saturday = 13:00 UTC. (8 AM EST during winter — see plan notes.)
  schedule:
    - cron: "0 13 * * 6"
  workflow_dispatch:
  # Re-run after any push to main so the bot's fresh-scrape always wins
  # over locally-regenerated HTML pushes. The bot's own commits use the
  # default GITHUB_TOKEN which does NOT trigger further workflow runs,
  # so this won't loop.
  push:
    branches: [main]
    paths-ignore:
      - "screenshots/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # All_Salons.xlsx is committed to the repo and updated manually for now
      # (Power BI export automation is parked — see pbi_export.js).

      - name: Scrape Employee_Stats and Employee_Return_Stats
        env:
          SALONDATA_USERNAME: ${{ secrets.SALONDATA_USERNAME }}
          SALONDATA_PASSWORD: ${{ secrets.SALONDATA_PASSWORD }}
        run: node scrape.js

      - name: Convert scraped CSVs to XLSX
        run: python convert_downloads.py

      - name: Generate dashboards
        run: python generate_data.py

      - name: Commit dashboards only if scraped week is newer
        run: |
          NEW_WEEK=$(python -c "import re,sys;m=re.search(r'\"week_label\":\"([0-9/]+)\"',open('index.html',encoding='utf-8').read());print(m.group(1) if m else '')")
          OLD_WEEK=$(git show HEAD:index.html 2>/dev/null | python -c "import re,sys;m=re.search(r'\"week_label\":\"([0-9/]+)\"',sys.stdin.read());print(m.group(1) if m else '')")
          echo "Scraped week: $NEW_WEEK | Committed week: $OLD_WEEK"
          # week_label is m/d/Y; convert to sortable YYYYMMDD for comparison
          to_key() { python -c "import sys; p=sys.argv[1].split('/'); print(f'{int(p[2]):04d}{int(p[0]):02d}{int(p[1]):02d}' if len(p)==3 else '00000000')" "$1"; }
          NEW_KEY=$(to_key "$NEW_WEEK")
          OLD_KEY=$(to_key "$OLD_WEEK")
          if [ -z "$NEW_WEEK" ]; then
            echo "Could not parse new week_label; aborting."
            exit 1
          fi
          if [ "$NEW_KEY" -lt "$OLD_KEY" ]; then
            echo "Scraped week ($NEW_WEEK) is OLDER than committed ($OLD_WEEK). Skipping commit to preserve fresher data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 3750.html 3800.html 3826.html 4216.html
          if git diff --cached --quiet; then
            echo "No dashboard changes to commit."
          else
            git commit -m "Weekly auto-update ($NEW_WEEK)"
            git push
          fi

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug
          path: |
            screenshots/
            *.xlsx
          if-no-files-found: ignore
          retention-days: 7
