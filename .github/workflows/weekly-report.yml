name: Weekly Report

on:
  # 9 AM EDT Saturday = 13:00 UTC. (8 AM EST during winter — see plan notes.)
  schedule:
    - cron: "0 13 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Node dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # All_Salons.xlsx is committed to the repo and updated manually for now
      # (Power BI export automation is parked — see pbi_export.js).

      - name: Scrape Employee_Stats and Employee_Return_Stats
        env:
          SALONDATA_USERNAME: ${{ secrets.SALONDATA_USERNAME }}
          SALONDATA_PASSWORD: ${{ secrets.SALONDATA_PASSWORD }}
        run: node scrape.js

      - name: Convert scraped CSVs to XLSX
        run: python convert_downloads.py

      - name: Generate dashboards
        run: python generate_data.py

      - name: Commit and push updated dashboards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 3750.html 3800.html 3826.html 4216.html
          if git diff --cached --quiet; then
            echo "No dashboard changes to commit."
          else
            git commit -m "Weekly auto-update"
            git push
          fi

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug
          path: |
            screenshots/
            *.xlsx
          if-no-files-found: ignore
          retention-days: 7
